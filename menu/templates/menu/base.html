<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Піцерія{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #faf6f0;
        }

        nav {
            background: #b22222;
            padding: 15px 30px;
            display: flex;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }

        .nav-right {
            margin-left: auto;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-right form {
            margin: 0;
        }

        .nav-right button {
            background: none;
            border: 1px solid white;
            color: white;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .price {
            color: #b22222;
            font-weight: bold;
        }

        .card label {
            display: inline-block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .card input[type="text"],
        .card input[type="number"],
        .card textarea,
        .card select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #d5c8bc;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 15px;
            background: #fffdfb;
        }

        .card textarea {
            resize: vertical;
        }

        .card input[type="checkbox"] {
            accent-color: #b22222;
        }

        .card button {
            background: #b22222;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .card button:hover {
            background: #8f1b1b;
        }

        .card a {
            color: #b22222;
            text-decoration: none;
        }

        .card a:hover {
            text-decoration: underline;
        }

        .card .error {
            color: #b22222;
            font-weight: bold;
        }

        .message {
            padding: 12px 16px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-weight: bold;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        .message.warning {
            background: #fff3cd;
            color: #856404;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .auth-card {
            max-width: 440px;
            margin: 20px auto;
        }

        .auth-card h1 {
            margin-top: 0;
            color: #8f1b1b;
            text-align: center;
        }

        .auth-card form p {
            margin-bottom: 16px;
        }

        .auth-card input[type="text"],
        .auth-card input[type="password"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #d5c8bc;
            border-radius: 6px;
            font-size: 15px;
        }

        .auth-card ul {
            color: #6b625c;
            font-size: 14px;
        }

        .auth-card .errorlist {
            color: #721c24;
            padding-left: 18px;
        }

        .auth-card form button,
        .auth-card .logout-button {
            width: 100%;
            background: #b22222;
            color: white;
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-card form button:hover,
        .auth-card .logout-button:hover {
            background: #8f1b1b;
        }

        .auth-card .auth-link {
            text-align: center;
            margin-top: 18px;
        }

        .auth-card .cancel-link {
            display: block;
            margin-top: 12px;
            text-align: center;
        }
    </style>

</head>

<body>
    <nav>
        <a href="{% url 'menu:home' %}">Головна</a>
        <a href="{% url 'menu:menu_list' %}">Меню</a>
        <div class="nav-right">
            {% if user.is_authenticated %}
            <span>{{user.username}}</span>
            <a href="{% url 'accounts:logout' %}">Вийти</a>
            {% else %}
                <a href="{% url "accounts:login" %}">Log in</a>
                <a href="{% url "accounts:register" %}">Registrate account</a>
            {% endif %}

        </div>
    </nav>

    <main>
        {% if messages %}
        {% for message in messages %}
        <div class="message {{ message.tags }}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>

</body>

</html>
