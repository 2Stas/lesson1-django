{% extends "menu/base.html" %}
{% block title %}
    Registration
{%endblock%}
{% block content %} 
<article class="card auth-card">
    <h1>Реєстрація</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Створити акаунт</button>
    </form>
    <p class="auth-link">
        Вже є акаунт?
        <a href="{% url 'accounts:login' %}">Увійти</a>
    </p>
</article>
{% endblock %}
