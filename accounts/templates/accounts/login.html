{% extends "menu/base.html" %}
{% block title %}
    Log in
{%endblock%}
{% block content %} 
<article class="card auth-card">
    <h1>Вхід в акаунт</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Увійти</button>
    </form>
    <p class="auth-link">
        Ще немає акаунту?
        <a href="{% url 'accounts:register' %}">Зареєструватися</a>
    </p>
</article>
{% endblock %}
